[project]
name = "lingdiff-api"
version = "0.1.0"
description = "Read-only HTTP API over lingdiff's precomputed language-comparison data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI's TestClient needs it
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "C4"]

[tool.mypy]
strict = true
